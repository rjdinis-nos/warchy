# Configuration for keychain
# Keeps the agent socket directory inside the Warchy credential home

[env]
KEYCHAIN_DIR="${WARCHY_CREDENTIAL_HOME:-$HOME/.ssh}/.keychain"

[post-install]
_cred_home="${WARCHY_CREDENTIAL_HOME:-$HOME/.ssh}"

# Migrate a pre-existing ~/.keychain into the credential home
if [[ -d "$HOME/.keychain" && ! -d "$_cred_home/.keychain" ]]; then
  gum style --foreground 245 "  → Migrating keychain from ~/.keychain to $_cred_home/.keychain"
  mkdir -p "$_cred_home"
  mv "$HOME/.keychain" "$_cred_home/.keychain"
fi
unset _cred_home

[post-remove]
# Preserve keychain config when removing (it's user data, not a package)
true
