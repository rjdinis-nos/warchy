# Configuration file for omawrite package management
# omawrite is a dead-simple Qt Quick Markdown writing app (https://github.com/omacom-io/omawrite)
# built from source using git-install, since it is only published through the
# Omarchy package repository (not the AUR or the official Arch repos).
#
# [dependencies] section:
#   - TEMP_BUILD_DEPS: Packages needed only for building (removed after build)
#   - BUILD_DEPS: Packages needed permanently (kept after build)
#   - Both resolve through warchy-pkg-manager, so every entry needs its own .conf.
#     The Qt 6 deps have none, so they are pulled by `makepkg -s` from the
#     upstream PKGBUILD instead (qt6-base, qt6-declarative, gcc, make).
#
# [version] section:
#   - Upstream keeps PKGBUILD `pkgver=0.1.0` pinned while shipping v0.x tags, so
#     the pacman version cannot be compared against the repository. The commit
#     that was actually built is recorded in
#     $XDG_STATE_HOME/warchy/omawrite.version and compared against repo HEAD.

[git]
GIT_REPO=https://github.com/omacom-io/omawrite.git

[dependencies]
# Temporary dependencies (installed for build, then removed)
TEMP_BUILD_DEPS=
# Permanent dependencies (installed and kept)
BUILD_DEPS=

[env]
# No environment variables needed for omawrite

[version]
command -v omawrite >/dev/null 2>&1 && cat "${XDG_STATE_HOME:-$HOME/.local/state}/warchy/omawrite.version" 2>/dev/null

[build]
# omawrite uses the XDG desktop portal for its open/save pickers and for
# dark/light mode detection, so a portal backend is required, not just the
# portal service itself.
sudo pacman -S --noconfirm --needed xdg-desktop-portal xdg-desktop-portal-gtk
# Build and pacman-install from the bundled PKGBUILD; `-s` pulls the Qt 6
# build and runtime dependencies. PKGBUILD's build() runs ./bin/build itself.
cd pkgbuild
makepkg -fsi --noconfirm
cd ..
# Record the built commit for the [version] check above
mkdir -p "${XDG_STATE_HOME:-$HOME/.local/state}/warchy"
git rev-parse HEAD | cut -c1-7 > "${XDG_STATE_HOME:-$HOME/.local/state}/warchy/omawrite.version"

[uninstall]
# makepkg also builds and installs omawrite-debug when /etc/makepkg.conf has the
# `debug` option enabled (the Arch default), so remove it too when present.
sudo pacman -Rns --noconfirm omawrite $(pacman -Qq omawrite-debug 2>/dev/null)
rm -f "${XDG_STATE_HOME:-$HOME/.local/state}/warchy/omawrite.version"
