[package]
PACKAGE_NAME=cliamp-bin pulseaudio-alsa
PACKAGE_INSTALLER=yay

[post-install]
# cliamp writes straight to ALSA, but WSL exposes no PCM device (/dev/snd holds
# only `timer`), so pulseaudio-alsa is required to route it to WSLg's PulseServer.
if [[ ! -e /etc/alsa/conf.d/50-pulseaudio.conf ]]; then
    gum style --foreground 1 "  → ALSA→PulseAudio bridge missing — cliamp will play silently"
elif [[ ! -S /mnt/wslg/PulseServer && -z "${PULSE_SERVER:-}" ]]; then
    gum style --foreground 3 "  → No PulseAudio server reachable — cliamp will play silently"
else
    gum style --foreground 2 "  → Audio routed through PulseAudio (run: cliamp)"
fi

[post-remove]
# pulseaudio-alsa is left installed: other audio apps rely on the same bridge
