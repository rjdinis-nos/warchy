# Configuration for GnuPG
# Keeps the GPG home inside the Warchy credential home alongside the SSH keys

[env]
GNUPGHOME="${WARCHY_CREDENTIAL_HOME:-$HOME/.ssh}/gnupg"

[post-install]
_cred_home="${WARCHY_CREDENTIAL_HOME:-$HOME/.ssh}"

# Migrate a pre-existing ~/.gnupg into the credential home
if [[ -d "$HOME/.gnupg" && ! -d "$_cred_home/gnupg" ]]; then
  gum style --foreground 245 "  → Migrating gnupg from ~/.gnupg to $_cred_home/gnupg"
  mkdir -p "$_cred_home"
  mv "$HOME/.gnupg" "$_cred_home/gnupg"
fi

# Configure gpg-agent to use pinentry-gnome3 (stores passphrase in gnome-keyring)
mkdir -p "$_cred_home/gnupg"
if [[ ! -f "$_cred_home/gnupg/gpg-agent.conf" ]] || ! grep -q "pinentry-program" "$_cred_home/gnupg/gpg-agent.conf"; then
  cat > "$_cred_home/gnupg/gpg-agent.conf" << 'AGENTCONF'
pinentry-program /usr/bin/pinentry-gnome3
allow-loopback-pinentry
AGENTCONF
  gum style --foreground 245 "  → Configured gpg-agent to use pinentry-gnome3 (keyring-backed passphrase)"
fi
unset _cred_home

[post-remove]
# Preserve gnupg config when removing (it's user data, not a package)
true
